apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-access
spec:
  podSelector:
    matchLabels:
      app: server-db
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: "client-pod"
    ports:
    - protocol: "TCP"
      port: "cli-port"

