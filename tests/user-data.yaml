#cloud-config
hostname: launcher
datasource_list: [ NoCloud ]

packages:
  - sudo
  - util-linux

# XXX alpine is ignore this
ssh_pwauth: true
write_files:
  - path: /etc/ssh/sshd_config.d/00-force-passwords.conf
    permissions: '0600'
    content: |
      PasswordAuthentication yes

users:
  - name: alpine
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - "{{SSH_PUBLIC_KEY}}"

bootcmd:
  - echo "root:alpine" | chpasswd

runcmd:
  - echo "alpine:alpine" | chpasswd
  - chmod g-s /home/alpine
  - mkdir -p /home/alpine/.ssh
  - chmod 700 /home/alpine/.ssh
  - chown -R alpine:alpine /home/alpine/.ssh
  - echo 'alias ll="ls -l"' >> /home/alpine/.profile
  - chown alpine:alpine /home/alpine/.profile
  - truncate -s 0 /etc/motd
